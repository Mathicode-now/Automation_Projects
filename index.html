<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Summer Goals 2026 ☀️</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Kid Selection Screen -->
        <div id="kid-select" class="screen active">
            <h1>☀️ Summer Goals 2026 ☀️</h1>
            <p class="subtitle">Who's checking in today?</p>
            <div class="kid-buttons"></div>
        </div>

        <!-- Main Dashboard -->
        <div id="dashboard" class="screen">
            <header>
                <button id="back-btn" aria-label="Go back">← Back</button>
                <h2 id="kid-name"></h2>
                <div id="streak-badge">🔥 <span id="streak-count">0</span> day streak</div>
            </header>

            <nav class="tab-bar">
                <button class="tab active" data-tab="daily">📋 Daily</button>
                <button class="tab" data-tab="physical">🚴 Physical</button>
                <button class="tab" data-tab="social">🤝 Social</button>
                <button class="tab" data-tab="selfcare">🧼 Self-Care</button>
                <button class="tab" data-tab="videos">🎬 Videos</button>
            </nav>

            <main id="tab-content"></main>

            <footer>
                <div class="progress-bar">
                    <div id="daily-progress" class="progress-fill"></div>
                </div>
                <p id="progress-text">0% done today</p>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
